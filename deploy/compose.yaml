# Production stack for one Hetzner server. Run from the repository root:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# See docs/DEPLOYMENT.md.
#
# deploy/.env only fills the ${...} placeholders below; no container receives the whole
# file. Each service lists exactly the variables it reads, so a new setting must be added
# here as well as to deploy/.env.example.
name: slotera-prod

x-server-env: &server-env
  SLOTERA_ENVIRONMENT: production
  SLOTERA_RELEASE: ${RELEASE:-latest}
  SLOTERA_LOG_LEVEL: ${SLOTERA_LOG_LEVEL:-INFO}
  # The restricted application role: no DDL, row-level security applies.
  SLOTERA_DATABASE_URL: postgresql+asyncpg://slotera_app:${SLOTERA_APP_DB_PASSWORD}@db:5432/slotera
  SLOTERA_CORS_ORIGINS: ${SLOTERA_CORS_ORIGINS}
  SLOTERA_PUBLIC_WEB_BASE_URL: ${SLOTERA_PUBLIC_WEB_BASE_URL}
  SLOTERA_CSRF_COOKIE_DOMAIN: ${SLOTERA_CSRF_COOKIE_DOMAIN}
  SLOTERA_EMAIL_PROVIDER: ${SLOTERA_EMAIL_PROVIDER:-resend}
  SLOTERA_EMAIL_FROM_ADDRESS: ${SLOTERA_EMAIL_FROM_ADDRESS}
  SLOTERA_RESEND_API_KEY: ${SLOTERA_RESEND_API_KEY}
  SLOTERA_SIGNUP_OPEN: ${SLOTERA_SIGNUP_OPEN:-false}
  SLOTERA_SENTRY_DSN: ${SLOTERA_SENTRY_DSN:-}

x-server: &server
  build: ../server
  image: slotera-server:${RELEASE:-latest}
  restart: unless-stopped
  environment: *server-env
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      ROOT_HOST: ${ROOT_HOST:?set ROOT_HOST in deploy/.env}
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST in deploy/.env}
      APP_HOST: ${APP_HOST:?set APP_HOST in deploy/.env}
      API_HOST: ${API_HOST:?set API_HOST in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web-demo, web-app, api]

  web-demo:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_DATA_SOURCE: mock
        # The demo only links to the real app (its pilot form); it never calls the API.
        NEXT_PUBLIC_APP_URL: https://${APP_HOST}
        NEXT_PUBLIC_SITE_URL: https://${DEMO_HOST}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-slotera@merulio.com}
    image: slotera-web-demo:${RELEASE:-latest}
    restart: unless-stopped
    environment:
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}

  web-app:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_DATA_SOURCE: api
        NEXT_PUBLIC_API_BASE_URL: https://${API_HOST}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: slotera_csrf
        NEXT_PUBLIC_SIGNUP_OPEN: ${SLOTERA_SIGNUP_OPEN:-false}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-slotera@merulio.com}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_WEB_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_WEB_PROJECT:-}
        SENTRY_RELEASE: ${RELEASE:-latest}
      secrets: [sentry_auth_token]
    image: slotera-web-app:${RELEASE:-latest}
    restart: unless-stopped
    environment:
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}

  # Applies migrations once per deploy; the API waits for it to finish.
  # The only service with the owner role (DDL, bypasses row-level security).
  migrate:
    <<: *server
    restart: "no"
    environment:
      <<: *server-env
      SLOTERA_MIGRATION_DATABASE_URL: postgresql+asyncpg://slotera_owner:${POSTGRES_PASSWORD}@db:5432/slotera
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *server
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *server
    command: ["slotera-email-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Auth clean-up, booking reminders and recurring-series top-up, every 15 minutes.
  maintenance:
    <<: *server
    command: ["sh", "-c", "while true; do slotera-maintenance || echo 'maintenance failed'; sleep 900; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slotera
      POSTGRES_USER: slotera_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SLOTERA_APP_DB_PASSWORD: ${SLOTERA_APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotera_owner -d slotera"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly pg_dump, kept 14 days locally and copied to the Hetzner Storage Box.
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: slotera_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: slotera
      STORAGE_BOX: ${STORAGE_BOX:-}
    volumes:
      - backups:/backups
      - ./backup/ssh:/root/.ssh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  backups:

secrets:
  # Used only while building web-app, to upload source maps to Sentry.
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
